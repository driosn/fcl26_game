# Builds the Steam Deck / Linux folder (dash-rambo.sh + binary + lib + data)
# and uploads it as a zip. GitHub downloads Flutter here; you only fetch the zip.
#
# Actions → Linux Steam Deck bundle → the run → Artifacts → dash-rambo-linux
name: Linux Steam Deck bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Dependencies
        run: flutter pub get

      - name: Package Dash Rambo
        run: ./tool/package_linux.sh

      - name: Verify bundle
        run: |
          test -x build/dash-rambo-linux/dash-rambo.sh
          test -x build/dash-rambo-linux/fcl_26_game
          test -d build/dash-rambo-linux/lib
          test -d build/dash-rambo-linux/data
          ls -la build/dash-rambo-linux

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: dash-rambo-linux
          path: build/dash-rambo-linux
          if-no-files-found: error
          retention-days: 14
